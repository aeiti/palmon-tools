name: PR checks

on:
  pull_request:
    branches: [main]

# Read-only access to the repo contents is all we need.
permissions:
  contents: read

# Cancel any in-progress run for the same PR when a new push lands —
# we only care about the latest state of the branch.
concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
