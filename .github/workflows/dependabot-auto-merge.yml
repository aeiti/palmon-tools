name: Dependabot auto-merge

# Auto-merges Dependabot PRs for patch and minor version bumps once
# pr-checks goes green. Major bumps still require manual review — they
# can have breaking changes that lint+test+build won't catch.
#
# Uses `pull_request_target` so the workflow runs in the context of the
# base branch (main) rather than the PR head. That's the standard pattern
# for Dependabot auto-merge: it gives the job access to secrets and
# write permissions while still executing trusted code from main.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for patch / minor bumps
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
