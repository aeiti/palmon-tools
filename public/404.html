<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Palmon Tools</title>
    <script>
      // SPA fallback for GitHub Pages.
      // Redirects /palmon-tools/<anything> to /palmon-tools/?/<anything>
      // and index.html unwraps it back into a real path for the router.
      // See https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1; // number of path segments to keep (repo name)
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
